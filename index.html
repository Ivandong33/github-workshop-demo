<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub 演示站点</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; text-align: center; background: #0d1117; color: #c9d1d9; }
        h1 { color: #58a6ff; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 2rem; margin: 2rem 0; }
        .badge { display: inline-block; background: #238636; color: white; padding: 4px 12px; border-radius: 999px; font-size: 0.8rem; }
        footer { margin-top: 3rem; color: #8b949e; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">🚀 GitHub Pages</span>
        <h1>欢迎来到 GitHub 演示站点</h1>
        <p>这是通过 GitHub Pages 自动部署的静态网站。</p>
        <p>展示 GitHub 的强大功能：代码托管 + CI/CD + 免费部署。</p>
    </div>
    <footer>
        <p>由 GitHub Actions 自动构建部署 · Ivandong33</p>
    </footer>
</body>
</html>
